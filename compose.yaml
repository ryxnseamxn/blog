# Local dev stack: Postgres + Friendsgiving API + Expo dev server.
# Expects the API repo checked out next to this one at ../friendsgiving-api.
# Variables come from .env in this folder (see .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: friendsgiving
      POSTGRES_USER: friendsgiving
      POSTGRES_PASSWORD: friendsgiving
    ports:
      # Published so `dotnet run` and DB tools on the host can reach it too.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendsgiving -d friendsgiving"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../friendsgiving-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=friendsgiving;Username=friendsgiving;Password=friendsgiving
      Admin__ApiKey: ${ADMIN_API_KEY:-}
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # The address phones are told to load the bundle from; the container's own IP is unreachable.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-localhost}
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      # Keep the Linux node_modules from the image instead of the host's macOS ones.
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
